name: publish
on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: git fetch --prune origin main
      - uses: coursier/cache-action@v8
      - uses: coursier/setup-action@v3
        with:
          jvm: 17
      - name: Publish
        run: ./mill --no-daemon mill.javalib.SonatypeCentralPublishModule/ --publishArtifacts channels.__.publishArtifacts
        env:
          MILL_PGP_PASSPHRASE: ${{ secrets.PUBLISH_SECRET_KEY_PASSWORD }}
          MILL_PGP_SECRET_BASE64: ${{ secrets.PUBLISH_SECRET_KEY }}
          MILL_SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MILL_SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      - run: cs launch scala-cli:1.0.0-RC1 --main-class scala.cli.ScalaCli --jvm 17 -- .github/scripts/generate-readme.sc
      - uses: stefanzweifel/git-auto-commit-action@v7.2.0
        with:
          file_pattern: README.md
          commit_message: Update README.md
          branch: main
          commit_author: Github Actions <actions@github.com>
